name: Sync produtos Caliente -> Supabase

on:
  schedule:
    # 06:00 UTC = 03:00 Brasilia (horario padrao). Roda 1x/dia.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo do sync"
        type: choice
        required: true
        default: incremental
        options:
          - incremental
          - full

concurrency:
  group: sync-produtos
  cancel-in-progress: false

# actions: write e para o passo de keepalive reabilitar o proprio workflow.
permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        run: pip install -r scraper/requirements.txt

      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODO: ${{ inputs.modo || 'incremental' }}
        run: python scraper/sync_produtos.py

      # O GitHub desliga crons de repo publico apos 60 dias sem commit (aconteceu
      # de 11/08 a 19/10/2026). Reabilitar o workflow pela API zera esse prazo,
      # sem commit vazio (mesma tecnica do gautamkrishnar/keepalive-workflow v2).
      - name: Keepalive do cron
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-produtos.yml/enable"
