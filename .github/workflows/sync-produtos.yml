name: Sync produtos Caliente -> Supabase

on:
  schedule:
    # 06:00 UTC = 03:00 Brasilia (horario padrao). Roda 1x/dia.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo do sync"
        type: choice
        required: true
        default: incremental
        options:
          - incremental
          - full

concurrency:
  group: sync-produtos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        run: pip install -r scraper/requirements.txt

      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODO: ${{ inputs.modo || 'incremental' }}
        run: python scraper/sync_produtos.py
